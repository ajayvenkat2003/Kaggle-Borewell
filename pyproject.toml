[project]
name = "borewell"
version = "0.1.0"
description = "This project to predict TVT given coordinates(x,y,z) of drill bit and Gamma Ray at the point"
readme = "README.md"
requires-python = ">=3.11 , <3.13"
dependencies = [
    "protobuf<4.0.0",
    "lightgbm>=4.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pandera>=0.31.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "setuptools<81",
    "mlflow>=1.27.0",
]

[dependency-groups]

test = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
[tool.ruff]
line-length=100
indent-width = 4
fix = true
[tool.rufff.format]
convention = "google"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[project.scripts]
train = "src.application.train:main"
