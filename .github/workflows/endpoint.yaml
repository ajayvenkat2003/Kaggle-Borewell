name: 'pr_workflow'
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test_format:
    runs-on: self-hosted
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: create container
        run: |
          docker compose -f docker-compose-train.yaml down -v 
          docker compose -f docker-compose-train.yaml up --build
      
        

